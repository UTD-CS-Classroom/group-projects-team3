<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 6px;
        }
        input[type="checkbox"] {
            margin-right: 5px;
        }
    </style>
</head>
<body>
<h1>Admin Dashboard</h1>

<!-- List of Teachers -->
<h2>All Teachers</h2>
<ul>
    <li th:each="t : ${teachers}" th:text="${t.email}"></li>
</ul>

<!-- List of Students -->
<h2>All Students</h2>
<ul>
    <li th:each="s : ${students}" th:text="${s.email}"></li>
</ul>

<!-- Create Course Form -->
<h2>Create Course</h2>
<form th:action="@{/admin/create-course}" method="post" th:object="${newCourse}">
    <label>Course Name:</label>
    <input type="text" th:field="*{name}" required /><br/>

    <label>Description:</label>
    <input type="text" th:field="*{description}" /><br/>

    <label>Credits:</label>
    <input type="number" th:field="*{credits}" min="1" max="6" /><br/>

    <label>Meeting Days:</label><br/>
    <div th:each="d : ${T(java.time.DayOfWeek).values()}">
        <input type="checkbox" th:field="*{daysOfWeek}" th:value="${d}" /> <span th:text="${d}"></span><br/>
    </div>

    <label>Start Time:</label>
    <input type="time" th:field="*{startTime}" /><br/>

    <label>End Time:</label>
    <input type="time" th:field="*{endTime}" /><br/>

    <label>Assign Teacher:</label>
    <select name="teacherId" required>
        <option th:each="t : ${teachers}" th:value="${t.id}" th:text="${t.email}"></option>
    </select><br/>

    <button type="submit">Create Course</button>
</form>

<!-- Existing Courses Table -->
<h2>Existing Courses</h2>
<table>
    <tr>
        <th>Name</th>
        <th>Teacher</th>
        <th>Days</th>
        <th>Time</th>
        <th>Action</th>
    </tr>
    <tr th:each="c : ${courses}">
        <td th:text="${c.name}"></td>
        <td th:text="${c.teacher.email}"></td>
        <td th:text="${#strings.arrayJoin(c.daysOfWeek.toArray(), ', ')}"></td>
        <td th:text="|${c.startTime} - ${c.endTime}|"></td>
        <td>
            <form th:action="@{/admin/delete-course}" method="post">
                <input type="hidden" name="courseId" th:value="${c.id}" />
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
</table>

<!-- Flash Messages -->
<div th:if="${error}" style="color:red;">❌ <span th:text="${error}"></span></div>
<div th:if="${success}" style="color:green;">✅ <span th:text="${success}"></span></div>

<a th:href="@{/logout}">Logout</a>
</body>
</html>
