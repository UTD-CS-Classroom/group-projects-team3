<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Teacher Dashboard</title></head>
<body>
<h2>Welcome Teacher!</h2>
<div th:if="${error}" style="color:red;">❌ <span th:text="${error}"></span></div>
<div th:if="${success}" style="color:green;">✅ <span th:text="${success}"></span></div>
<h1>Teacher Dashboard</h1>
<a th:href="@{/teacher/add-course}">Add New Course</a>
<h2>Your Courses</h2>
<ul>
    <li th:each="c : ${courses}">
        <span th:text="${c.name}"></span>
        <form th:action="@{/teacher/delete-course}" method="post" style="display:inline;">
            <input type="hidden" name="courseId" th:value="${c.id}" />
            <button type="submit">Delete</button>
        </form>
    </li>
</ul>
<a th:href="@{/logout}">Logout</a>
</body>
</html>
