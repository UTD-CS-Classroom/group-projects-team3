<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Dashboard</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid black;
            padding: 5px;
            text-align: left;
        }
    </style>
</head>
<body>
<h2>Welcome Student!</h2>
<h2>Available Courses</h2>
<table>
    <tr>
        <th>Course Name</th>
        <th>Teacher Email</th>
        <th>Description</th>
        <th>Credits</th>
        <th>Days</th>
        <th>Time</th>
        <th>Enroll</th>
    </tr>
    <tr th:each="c : ${allCourses}">
        <td th:text="${c.name}"></td>
        <td th:text="${c.teacher.email}"></td>
        <td th:text="${c.description}"></td>
        <td th:text="${c.credits}"></td>
        <td th:text="${#strings.arrayJoin(c.daysOfWeek.toArray(), ', ')}"></td>
        <td th:text="${c.startTime} + ' - ' + ${c.endTime}"></td>
        <td>
            <form th:action="@{/student/enroll}" method="post">
                <input type="hidden" name="courseId" th:value="${c.id}" />
                <button type="submit">Enroll</button>
            </form>
        </td>
    </tr>
</table>
<div th:if="${error}" style="color:red;">❌ <span th:text="${error}"></span></div>
<div th:if="${success}" style="color:green;">✅ <span th:text="${success}"></span></div>
<h2>Your Registered Courses</h2>

<ul>
    <li th:each="sc : ${registrations}">
        <span th:text="${sc.course.name}"></span>
        <span th:text="${sc.course.teacher.email}"></span> :
        <span th:text="${sc.course.description}"></span>
        <form th:action="@{/student/unenroll}" method="post" style="display:inline;">
            <input type="hidden" name="courseId" th:value="${sc.course.id}" />
            <button type="submit">Unenroll</button>
        </form>
    </li>
</ul>
<a th:href="@{/logout}">Logout</a>
</body>
</html>
