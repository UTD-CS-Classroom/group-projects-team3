<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Course</title>
</head>
<body>
<h2>Add New Course</h2>
<form th:action="@{/teacher/add-course}" th:object="${course}" method="post">
    <label>Course Name:</label>
    <input type="text" th:field="*{name}" required /><br/>

    <label>Description:</label>
    <textarea th:field="*{description}" required></textarea><br/>

    <label>Credits:</label>
    <input type="number" th:field="*{credits}" min="1" required /><br/>

    <label>Days of the Week:</label><br/>
    <input type="checkbox" th:field="*{daysOfWeek}" value="MONDAY"/> Mon
    <input type="checkbox" th:field="*{daysOfWeek}" value="TUESDAY"/> Tue
    <input type="checkbox" th:field="*{daysOfWeek}" value="WEDNESDAY"/> Wed
    <input type="checkbox" th:field="*{daysOfWeek}" value="THURSDAY"/> Thu
    <input type="checkbox" th:field="*{daysOfWeek}" value="FRIDAY"/> Fri<br/>

    <label>Start Time:</label>
    <input type="time" th:field="*{startTime}" required /><br/>

    <label>End Time:</label>
    <input type="time" th:field="*{endTime}" required /><br/>

    <button type="submit">Add Course</button>
</form>
<a th:href="@{/teacher/dashboard}">Back to Dashboard</a>
</body>
</html>
