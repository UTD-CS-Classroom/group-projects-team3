<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Portal Login</title>
    <link rel="stylesheet" th:href="@{/css/login_style.css}">
</head>
<body>
<header class="header">
    <div class="header-content">
        <h1>University <span>Portal</span></h1>
    </div>
</header>

<main class="container login-page">
    <div class="login-card">
        <div class="login-header-text">
            <h2>Sign in</h2>
            <p>Use your university account to continue.</p>
        </div>

        <form class="login-form" th:action="@{/process-login}" method="post">
            <div>
                <label for="username">Email</label>
                <input id="username"
                       type="email"
                       name="username"
                       placeholder="netid@utdallas.edu"
                       required />
            </div>

            <div>
                <label for="password">Password</label>
                <input id="password"
                       type="password"
                       name="password"
                       placeholder="Password"
                       required />
            </div>

            <button type="submit" class="login-button">Login</button>
        </form>

        <div th:if="${param.error}" class="alert alert-error">
            Invalid email or password.
        </div>
        <div th:if="${param.logout}" class="alert alert-success">
            You have been logged out.
        </div>

        <p class="login-extra">
            Contact IT support if you have trouble signing in.
        </p>
    </div>
</main>
</body>
</html>
