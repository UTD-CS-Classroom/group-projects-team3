<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- match your other pages: static/css/adminDashboard_style.css -->
    <link rel="stylesheet" th:href="@{/css/adminDashboard_style.css}">
</head>
<body>

<header class="header">
    <div class="header-content">
        <h1>University <span>Admin</span> Dashboard</h1>
        <a th:href="@{/logout}" class="logout-btn">Logout</a>
    </div>
</header>

<main class="container">

    <!-- Flash Messages -->
    <div th:if="${error}" class="alert alert-error">
        ❌ <span th:text="${error}"></span>
    </div>
    <div th:if="${success}" class="alert alert-success">
        ✅ <span th:text="${success}"></span>
    </div>

    <!-- Quick stats -->
    <section class="section">
        <div class="section-header">
            <h2 class="section-title">Overview</h2>
        </div>
        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-value" th:text="${#lists.size(teachers)}">0</div>
                <div class="stat-label">Teachers</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" th:text="${#lists.size(students)}">0</div>
                <div class="stat-label">Students</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" th:text="${#lists.size(courses)}">0</div>
                <div class="stat-label">Courses</div>
            </div>
        </div>
    </section>

    <!-- Users -->
    <section class="section">
        <div class="section-header">
            <h2 class="section-title">Users</h2>
        </div>

        <div class="two-column">
            <div>
                <h3 class="subheading">Teachers</h3>
                <ul class="simple-list">
                    <li th:each="t : ${teachers}" th:text="${t.email}"></li>
                </ul>
            </div>

            <div>
                <h3 class="subheading">Students</h3>
                <ul class="simple-list">
                    <li th:each="s : ${students}" th:text="${s.email}"></li>
                </ul>
            </div>
        </div>
    </section>

    <!-- Create Course -->
    <section class="section">
        <div class="section-header">
            <h2 class="section-title">Create Course</h2>
        </div>

        <form th:action="@{/admin/create-course}" method="post"
              th:object="${newCourse}" class="form-grid">

            <div class="form-row">
                <label for="name">Course Name</label>
                <input id="name" type="text" th:field="*{name}" required>
            </div>

            <div class="form-row">
                <label for="description">Description</label>
                <textarea id="description" th:field="*{description}" rows="3"></textarea>
            </div>

            <div class="form-row">
                <label for="credits">Credits</label>
                <input id="credits" type="number" th:field="*{credits}" min="1" max="6" required>
            </div>

            <div class="form-row">
                <label>Meeting Days</label>
                <div class="checkbox-group" th:each="d : ${T(java.time.DayOfWeek).values()}">
                    <label class="checkbox-item">
                        <input type="checkbox" th:field="*{daysOfWeek}" th:value="${d}">
                        <span th:text="${d}"></span>
                    </label>
                </div>
            </div>

            <div class="form-row two-columns">
                <div>
                    <label for="startTime">Start Time</label>
                    <input id="startTime" type="time" th:field="*{startTime}">
                </div>
                <div>
                    <label for="endTime">End Time</label>
                    <input id="endTime" type="time" th:field="*{endTime}">
                </div>
            </div>

            <div class="form-row">
                <label for="teacherId">Assign Teacher</label>
                <select id="teacherId" name="teacherId" required>
                    <option value="" disabled selected>Select a teacher</option>
                    <option th:each="t : ${teachers}"
                            th:value="${t.id}"
                            th:text="${t.email}">
                    </option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Create Course</button>
            </div>
        </form>
    </section>

    <!-- Existing Courses -->
    <section class="section">
        <div class="section-header">
            <h2 class="section-title">Existing Courses</h2>
        </div>

        <table class="data-table">
            <thead>
            <tr>
                <th>Name</th>
                <th>Teacher</th>
                <th>Days</th>
                <th>Time</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${courses}">
                <td th:text="${c.name}"></td>
                <td th:text="${c.teacher.email}"></td>
                <td th:text="${#strings.arrayJoin(c.daysOfWeek.toArray(), ', ')}"></td>
                <td th:text="|${c.startTime} - ${c.endTime}|"></td>
                <td>
                    <form th:action="@{/admin/delete-course}" method="post">
                        <input type="hidden" name="courseId" th:value="${c.id}">
                        <button type="submit" class="btn btn-danger">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(courses)}">
                <td colspan="5" class="empty-state">No courses created yet.</td>
            </tr>
            </tbody>
        </table>
    </section>

</main>

</body>
</html>
