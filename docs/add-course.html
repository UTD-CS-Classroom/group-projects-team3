<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Course</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Link to your CSS in static/css -->
    <link rel="stylesheet" th:href="@{/css/add_course_style.css}">
</head>
<body>
<header class="header">
    <div class="header-content">
        <h1>University Portal <span>Teacher</span></h1>
        <a th:href="@{/teacher/dashboard}" class="back-link">Back to Dashboard</a>
    </div>
</header>

<main class="container">
    <section class="form-card">
        <h2 class="form-title">Add New Course</h2>

        <form th:action="@{/teacher/add-course}" th:object="${course}" method="post" class="course-form">
            <div class="form-group">
                <label for="name">Course Name</label>
                <input id="name" type="text" th:field="*{name}" required>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" th:field="*{description}" rows="3" required></textarea>
            </div>

            <div class="form-group">
                <label for="credits">Credits</label>
                <input id="credits" type="number" th:field="*{credits}" min="1" required>
            </div>

            <div class="form-group">
                <label>Days of the Week</label>
                <div class="checkbox-row">
                    <label class="checkbox-item">
                        <input type="checkbox" th:field="*{daysOfWeek}" value="MONDAY"> Mon
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" th:field="*{daysOfWeek}" value="TUESDAY"> Tue
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" th:field="*{daysOfWeek}" value="WEDNESDAY"> Wed
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" th:field="*{daysOfWeek}" value="THURSDAY"> Thu
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" th:field="*{daysOfWeek}" value="FRIDAY"> Fri
                    </label>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group half">
                    <label for="startTime">Start Time</label>
                    <input id="startTime" type="time" th:field="*{startTime}" required>
                </div>
                <div class="form-group half">
                    <label for="endTime">End Time</label>
                    <input id="endTime" type="time" th:field="*{endTime}" required>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Add Course</button>
                <a th:href="@{/teacher/dashboard}" class="btn-secondary">Cancel</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
